# ============================================
# Config untuk Nginx yang sudah ada di server
# ============================================
# Letakkan di: /etc/nginx/sites-available/whatsapp
# Aktifkan: sudo ln -s /etc/nginx/sites-available/whatsapp /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream untuk Docker containers
upstream whatsapp_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream whatsapp_frontend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name wa.yourdomain.com;  # Ganti dengan domain Anda

    # ACME challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Server
server {
    listen 443 ssl http2;
    server_name wa.yourdomain.com;  # Ganti dengan domain Anda

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/wa.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=whatsapp_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=whatsapp_upload:10m rate=5r/s;

    # Client max body size
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/whatsapp-access.log;
    error_log /var/log/nginx/whatsapp-error.log;

    # Health Check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API Backend (proxy ke Docker backend)
    location /api/ {
        limit_req zone=whatsapp_api burst=20 nodelay;

        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://whatsapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # File Upload
    location ~ ^/api/send_message {
        limit_req zone=whatsapp_upload burst=10 nodelay;
        client_max_body_size 50M;

        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://whatsapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Frontend (proxy ke Docker frontend)
    location / {
        proxy_pass http://whatsapp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Static asset caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://whatsapp_frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
