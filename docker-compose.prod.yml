services:
  # MongoDB Database
  mongo:
    container_name: whatsapp-mongo-prod
    image: mongo:7.0
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-qr_db}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Backend API
  backend:
    container_name: whatsapp-backend-prod
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: always
    volumes:
      - whatsapp-stores:/app/stores
      - whatsapp-uploads:/app/uploads
      - app-keys:/app/keys
      - app-logs:/app/logs
    environment:
      # Server
      PORT: 3000
      ENVIRONMENT: production

      # MongoDB
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_HOST: mongo:27017
      MONGO_DB: ${MONGO_DB:-qr_db}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}

      # WhatsApp
      WHATSAPP_STORES_DIR: ./stores
      WHATSAPP_UPLOADS_DIR: ./uploads/whatsapp
      WHATSAPP_MAX_CONCURRENCY: ${WHATSAPP_MAX_CONCURRENCY:-10}

      # CORS
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-43200}
    networks:
      - app-net
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend
  frontend:
    container_name: whatsapp-frontend-prod
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    restart: always
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy
  # nginx:
  #   container_name: whatsapp-nginx-prod
  #   image: nginx:alpine
  #   restart: always
  #   ports:
  #     - "${HTTP_PORT:-80}:80"
  #     - "${HTTPS_PORT:-443}:443"
  #   volumes:
  #     - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - nginx-logs:/var/log/nginx
  #     - nginx-cache:/var/cache/nginx
  #   networks:
  #     - app-net
  #   depends_on:
  #     - backend
  #     - frontend
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1'
  #         memory: 512M
  #       reservations:
  #         cpus: '0.25'
  #         memory: 256M
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  whatsapp-stores:
    driver: local
  whatsapp-uploads:
    driver: local
  app-keys:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local

networks:
   app-net:
    external: true
