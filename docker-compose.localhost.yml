services:
  # MongoDB Database
  mongo:
    container_name: whatsapp-mongo-local
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-qr_db}
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    container_name: whatsapp-backend-local
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: always
    volumes:
      - whatsapp-stores:/app/stores
      - whatsapp-uploads:/app/uploads
      - app-keys:/app/keys
      - app-logs:/app/logs
    environment:
      # Server
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # MongoDB
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASS: ${MONGO_PASS:-password}
      MONGO_HOST: mongo:27017
      MONGO_DB: ${MONGO_DB:-qr_db}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}

      # WhatsApp
      WHATSAPP_STORES_DIR: ./stores
      WHATSAPP_UPLOADS_DIR: ./uploads/whatsapp
      WHATSAPP_MAX_CONCURRENCY: ${WHATSAPP_MAX_CONCURRENCY:-10}

      # CORS
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-43200}
    networks:
      - whatsapp-network
    depends_on:
      mongo:
        condition: service_healthy

  # Frontend
  frontend:
    container_name: whatsapp-frontend-local
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    restart: always
    networks:
      - whatsapp-network

  # Nginx Reverse Proxy (HTTP only for localhost)
  nginx:
    container_name: whatsapp-nginx-local
    image: nginx:alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.localhost.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    networks:
      - whatsapp-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  whatsapp-stores:
    driver: local
  whatsapp-uploads:
    driver: local
  app-keys:
    driver: local
  app-logs:
    driver: local
  nginx-logs:
    driver: local
  nginx-cache:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
